user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"ref":"$http_referer","ua":"$http_user_agent","rt":"$request_time"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # ── Upstream Services ───────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── Main Server ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers (applied globally)
        add_header X-Content-Type-Options      "nosniff"             always;
        add_header X-Frame-Options             "DENY"               always;
        add_header X-XSS-Protection            "1; mode=block"      always;
        add_header Referrer-Policy             "no-referrer"        always;
        add_header Permissions-Policy          "geolocation=()"     always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

        # ── API reverse proxy ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            
            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # Disable buffering for streaming
            proxy_buffering off;
        }

        # ── Auth endpoints — stricter rate limit ──────────────────────────
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend/api/v1/auth/login;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Health check (no rate limit) ──────────────────────────────────
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ── Frontend (SPA) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_http_version 1.1;
        }

        # ── Metrics endpoint (restrict to internal only) ──────────────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend/metrics;
        }
    }
}
